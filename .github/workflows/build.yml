name: Build and verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, verify and package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\build.ps1
          .\scripts\verify.ps1
          .\scripts\package.ps1
      - name: Independently rebuild source package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -LiteralPath .\release\CursorGuard-1.3.0-source.zip -DestinationPath .\ci-rebuild
          .\ci-rebuild\CursorGuard-1.3.0-source\scripts\build.ps1
          .\ci-rebuild\CursorGuard-1.3.0-source\scripts\verify.ps1
