name: Publish verified release
on:
  push:
    branches: [main]
    paths: ['.github/release-request.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-v1.3.0
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'RAINDAYS121/CursorGuard' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check explicit version request and build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $request=Get-Content -LiteralPath .github/release-request.json -Raw | ConvertFrom-Json
          if($request.version -ne '1.3.0' -or $request.publish -ne $true) {throw 'No matching release request.'}
          .\scripts\build.ps1
          .\scripts\verify.ps1
          .\scripts\package.ps1
          Expand-Archive -LiteralPath release/CursorGuard-1.3.0-source.zip -DestinationPath ci-rebuild
          .\ci-rebuild\CursorGuard-1.3.0-source\scripts\build.ps1
          .\ci-rebuild\CursorGuard-1.3.0-source\scripts\verify.ps1
      - name: Transfer verified assets to the publishing job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-v1.3.0-${{ github.sha }}
          path: |
            release/CursorGuard-1.3.0.zip
            release/CursorGuard-1.3.0-source.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: prepare
    if: github.repository == 'RAINDAYS121/CursorGuard' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-v1.3.0-${{ github.sha }}
          path: release
      - name: Publish exact commit and checked assets
        shell: pwsh
        env:
          RELEASE_TOKEN: ${{ github.token }}
        run: .\scripts\publish-release.ps1
